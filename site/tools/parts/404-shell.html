<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>404 · QuickRemote</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #F4F5FA; --fg: #0E1224; --fg-2: #4A5172; --accent: #2F4BE0; --line: #E1E4EE; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0A0D18; --fg: #EEF0FA; --fg-2: #A9AFCB; --accent: #8EA1FF; --line: #252B47; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 400 1.0625rem/1.6 ui-sans-serif, system-ui, sans-serif; }
    main { width: 100%; max-width: 520px; }
    .mark { width: 56px; height: 56px; display: block; margin-bottom: 24px; }
    section + section { margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--line); }
    h1 { margin: 0 0 8px; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.1; letter-spacing: -.02em; }
    p { margin: 0 0 16px; color: var(--fg-2); }
    a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><defs></defs>@MARK@</svg>
<main>
  <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
@BODY@</main>
</body>
</html>
