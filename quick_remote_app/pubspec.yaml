name: quick_remote_app
description: "QuickRemote Android remote: controls presentations on the PC over Wi-Fi or as a Bluetooth keyboard and mouse."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  mobile_scanner: ^7.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  vibration: ^3.1.8
  wakelock_plus: ^1.4.0
  web_socket_channel: ^3.0.3
  nsd: ^5.0.1
  crypto: ^3.0.7
  quick_remote_shared:
    path: ../packages/quick_remote_shared
  flutter_background: ^1.3.1
  permission_handler: ^13.0.2
  text_scroll: ^0.2.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
  fonts:
    # Inter (SIL OFL 1.1, assets/fonts/OFL.txt), bundled so the app never
    # downloads fonts at runtime.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    # Space Grotesk (SIL OFL 1.1, assets/fonts/OFL-SpaceGrotesk.txt): the brand's
    # display face for headings, the wordmark and figures. Static instances of
    # the variable font, so FontWeight picks them without font variations.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700

# The launcher icons are exported by brand/tools/export_assets.sh, which also
# writes the Android 13 monochrome layer this plugin version cannot make.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#2F4BE0"
  adaptive_icon_foreground: "assets/images/logo_padded.png"
